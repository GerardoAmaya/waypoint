name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      # Misma imagen que en desarrollo: postgres pelado no trae PostGIS y las
      # migraciones fallarian.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: waypoint
          POSTGRES_PASSWORD: waypoint
          POSTGRES_DB: waypoint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waypoint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://waypoint:waypoint@localhost:5432/waypoint_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests scripts

      - name: Formato
        run: ruff format --check app tests scripts

      - name: Migraciones y esquema
        run: pytest tests/ -v
