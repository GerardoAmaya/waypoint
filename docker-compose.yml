services:
  db:
    # Imagen con PostGIS incluido. Postgres pelado no sirve: las consultas
    # espaciales son el nucleo de este proyecto.
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waypoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waypoint}
      POSTGRES_DB: ${POSTGRES_DB:-waypoint}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waypoint}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      # La raiz y no ./backend: el mismo contexto que usa Railway, para que las
      # dos construcciones sean la misma. Ver el comentario del Dockerfile.
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_DEV: "true"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-waypoint}:${POSTGRES_PASSWORD:-waypoint}@db:5432/${POSTGRES_DB:-waypoint}
    ports:
      - "8100:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # OSRM propio, uno por perfil. Opcionales: solo arrancan con
  # `docker compose --profile osrm up -d`, que es lo que hace `make osrm`.
  #
  # **Son dos servicios y no uno porque osrm-routed sirve un solo perfil**: el
  # que se preparo al construir el grafo. El perfil que va en la URL lo ignora,
  # asi que a pie y en carro necesitan cada uno su contenedor y su grafo.
  #
  # El grafo lo construye `make osrm-datos` antes, dentro de ./osrm. Si esa
  # carpeta esta vacia, el contenedor arranca y se cae; el mensaje de osrm-routed
  # lo dice con claridad y make osrm avisa antes.
  osrm-car:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["osrm"]
    ports:
      - "5000:5000"
    volumes:
      - ./osrm/car:/data
    command: osrm-routed --algorithm mld /data/el-salvador.osrm

  osrm-foot:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["osrm"]
    ports:
      - "5001:5000"
    volumes:
      - ./osrm/foot:/data
    command: osrm-routed --algorithm mld /data/el-salvador.osrm

volumes:
  pgdata:
