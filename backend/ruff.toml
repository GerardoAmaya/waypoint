line-length = 95
target-version = "py311"

[lint]
select = ["E", "F", "I", "UP", "B"]

ignore = [
    # Depends(), Query() y File() como valor por defecto es el idioma de
    # FastAPI, no un descuido. B008 no lo distingue.
    "B008",
    # El import de app.models en env.py registra las tablas en Base.metadata
    # aunque el nombre no se use.
    "E402",
    # str + Enum se mantiene a proposito: hace que el valor se serialice como
    # cadena en JSON sin conversion explicita.
    "UP042",
]

[lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[lint.isort]
# Existe una carpeta backend/alembic/ con las migraciones, asi que ruff
# clasifica "alembic" como codigo propio y lo ordena en el bloque equivocado.
# Es la libreria de terceros; la carpeta solo comparte el nombre.
known-third-party = ["alembic", "geoalchemy2"]
# El codigo propio vive en estos paquetes.
known-first-party = ["app", "tests", "scripts"]
